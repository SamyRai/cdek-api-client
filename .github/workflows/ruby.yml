name: Ruby CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types:
      - created

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We do not need id-token: write for build, only for publish
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Verify generated code is up-to-date
        run: |
          bundle exec bin/cdek-builder generate
          git diff --exit-code || (echo "Generated files are out of sync! Please run 'bundle exec bin/cdek-builder generate' locally and commit the changes." && exit 1)

      - name: Run tests
        run: bundle exec rspec

      - name: Lint with RuboCop
        run: bundle exec rubocop

  create_release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  publish:
    if: (github.event_name == 'release' && github.event.action == 'created') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # Required for trusted publishing

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
