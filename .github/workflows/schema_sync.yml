name: Schema Sync and Auto-Generate

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Fetch Latest Schema & Generate
        run: |
          bin/cdek-builder all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Auto-update SDK based on latest CDEK OpenAPI schema"
          title: "🚀 Auto-update SDK based on latest CDEK OpenAPI schema"
          body: |
            This PR was automatically generated by the Schema Sync action.
            
            It fetches the latest OpenAPI schema from CDEK and runs the `schema:generate_all` pipeline to update entities, endpoints, fixtures, and documentation.
            
            Please review the changes to ensure compatibility.
          branch: "auto-schema-sync"
          delete-branch: true
          labels: "automated, schema-update"
